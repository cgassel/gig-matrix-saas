<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account — Gig Matrix</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0ebe0; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 36px 32px; max-width: 400px; width: 100%; }
    h1 { font-size: 1.4rem; color: #A07018; margin: 0 0 4px; }
    p.sub { color: #6b5e48; font-size: 0.88rem; margin: 0 0 24px; }
    label { display: block; font-size: 0.8rem; font-weight: 700; color: #6b5e48; margin-bottom: 5px; margin-top: 16px; }
    input { width: 100%; padding: 11px 13px; border: 1.5px solid #d4c4a0; border-radius: 8px; font-size: 0.92rem; font-family: inherit; }
    input:focus { outline: none; border-color: #A07018; }
    button { width: 100%; margin-top: 24px; padding: 13px; background: #A07018; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    button:hover:not(:disabled) { background: #8a6014; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { background: #fdecea; color: #8B2000; border: 1.5px solid #f5c6c0; border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; margin-top: 16px; display: none; }
    .success { background: #e8f5e9; color: #2e7d32; border: 1.5px solid #a5d6a7; border-radius: 8px; padding: 16px; font-size: 0.9rem; margin-top: 16px; display: none; text-align: center; }
    .footer-link { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #6b5e48; }
    .footer-link a { color: #A07018; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create Your Account</h1>
    <p class="sub">Set up your booking business on Gig Matrix.</p>

    <form id="signupForm">
      <label>Business Name</label>
      <input type="text" id="businessName" required placeholder="Your Agency Name">

      <label>Your Name</label>
      <input type="text" id="ownerName" required placeholder="Jane Smith">

      <label>Email</label>
      <input type="email" id="email" required placeholder="you@example.com">

      <label>Password</label>
      <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">

      <button type="submit" id="submitBtn">Create Account</button>
    </form>

    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg">
      <strong>&#x2713; Account created!</strong><br>
      <span id="successDetail"></span>
    </div>

    <div class="footer-link">Already have an account? <a href="login.html">Log in</a></div>
  </div>

  <script src="config.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      var businessName = document.getElementById('businessName').value.trim();
      var ownerName     = document.getElementById('ownerName').value.trim();
      var email         = document.getElementById('email').value.trim();
      var password      = document.getElementById('password').value;

      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        // Step 1: create the login itself via Supabase Auth
        var { data: authData, error: authError } = await sb.auth.signUp({ email: email, password: password });
        if (authError) throw authError;

        // If email confirmation is ON in your Supabase project, there's no
        // active session yet at this point — the person has to click the
        // link in their inbox first, and the business gets created the
        // first time they successfully log in (see login.html). If email
        // confirmation is OFF (fine for testing), there's already a
        // session, so we can finish setup immediately.
        if (!authData.session) {
          document.getElementById('signupForm').style.display = 'none';
          document.getElementById('successDetail').textContent =
            'Check ' + email + ' for a confirmation link. Once you click it and log in, your business will be set up automatically.';
          document.getElementById('successMsg').style.display = 'block';
          return;
        }

        // Step 2: create the business + owner profile together
        var { error: rpcError } = await sb.rpc('create_business_and_owner', {
          p_business_name: businessName,
          p_owner_name: ownerName
        });
        if (rpcError) throw rpcError;

        window.location.href = 'dashboard.html';

      } catch (err) {
        errEl.textContent = err.message || 'Something went wrong. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
