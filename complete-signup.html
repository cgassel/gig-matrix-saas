<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Not Set Up — Gig Matrix</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0ebe0; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 36px 32px; max-width: 400px; width: 100%; text-align: center; }
    h1 { font-size: 1.3rem; color: #A07018; margin: 0 0 12px; }
    p { color: #6b5e48; font-size: 0.92rem; line-height: 1.5; margin: 0 0 20px; }
    a.btn { display: inline-block; padding: 12px 22px; background: #A07018; color: #fff; border-radius: 8px; font-size: 0.9rem; font-weight: 700; text-decoration: none; }
    a.btn:hover { background: #8a6014; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Your Account Isn't Set Up Yet</h1>
    <p>You're logged in, but there's no Gig Matrix account connected to this login. Accounts are created by an administrator — please contact yours to get set up.</p>
    <a class="btn" href="login.html" id="backBtn">Back to Log In</a>
  </div>

  <script src="config.js"></script>
  <script>
    // Defense in depth: this page used to create a brand-new business for
    // anyone who landed here. It no longer does that — it only signs the
    // person out so they aren't left in a half-authenticated state.
    document.getElementById('backBtn').addEventListener('click', async function() {
      try { await sb.auth.signOut(); } catch (e) {}
    });
  </script>
</body>
</html>
