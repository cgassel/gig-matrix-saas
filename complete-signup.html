<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finish Setting Up — Gig Matrix</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0ebe0; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 36px 32px; max-width: 400px; width: 100%; }
    h1 { font-size: 1.4rem; color: #A07018; margin: 0 0 4px; }
    p.sub { color: #6b5e48; font-size: 0.88rem; margin: 0 0 24px; }
    label { display: block; font-size: 0.8rem; font-weight: 700; color: #6b5e48; margin-bottom: 5px; margin-top: 16px; }
    input { width: 100%; padding: 11px 13px; border: 1.5px solid #d4c4a0; border-radius: 8px; font-size: 0.92rem; font-family: inherit; }
    button { width: 100%; margin-top: 24px; padding: 13px; background: #A07018; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { background: #fdecea; color: #8B2000; border: 1.5px solid #f5c6c0; border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>One More Step</h1>
    <p class="sub">Your email is confirmed — now let's set up your business.</p>

    <form id="setupForm">
      <label>Business Name</label>
      <input type="text" id="businessName" required placeholder="Your Agency Name">

      <label>Your Name</label>
      <input type="text" id="ownerName" required placeholder="Jane Smith">

      <button type="submit" id="submitBtn">Finish Setup</button>
    </form>

    <div class="error" id="errorMsg"></div>
  </div>

  <script src="config.js"></script>
  <script>
    // If nobody's actually logged in (someone bookmarked this page), send
    // them back to login rather than showing a form that'll just fail.
    (async function() {
      var { data: { session } } = await sb.auth.getSession();
      if (!session) window.location.href = 'login.html';
    })();

    document.getElementById('setupForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var businessName = document.getElementById('businessName').value.trim();
      var ownerName     = document.getElementById('ownerName').value.trim();
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Setting up…';

      try {
        var { error } = await sb.rpc('create_business_and_owner', {
          p_business_name: businessName,
          p_owner_name: ownerName
        });
        if (error) throw error;
        window.location.href = 'dashboard.html';
      } catch (err) {
        errEl.textContent = err.message || 'Something went wrong.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Finish Setup';
      }
    });
  </script>
</body>
</html>
