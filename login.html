<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Gig Matrix</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0ebe0; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 36px 32px; max-width: 380px; width: 100%; }
    h1 { font-size: 1.4rem; color: #A07018; margin: 0 0 6px; }
    .subtitle { font-size: 0.84rem; color: #6b5e48; margin-bottom: 20px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 22px; background: #f0ebe0; padding: 4px; border-radius: 10px; }
    .tab-btn { flex: 1; padding: 9px 6px; border: none; background: none; border-radius: 7px; font-size: 0.8rem; font-weight: 700; color: #6b5e48; cursor: pointer; font-family: inherit; }
    .tab-btn.active { background: #A07018; color: #fff; }
    label { display: block; font-size: 0.8rem; font-weight: 700; color: #6b5e48; margin-bottom: 5px; margin-top: 16px; }
    input { width: 100%; padding: 11px 13px; border: 1.5px solid #d4c4a0; border-radius: 8px; font-size: 0.92rem; font-family: inherit; }
    input:focus { outline: none; border-color: #A07018; }
    button[type="submit"] { width: 100%; margin-top: 24px; padding: 13px; background: #A07018; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    button[type="submit"]:hover:not(:disabled) { background: #8a6014; }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { background: #fdecea; color: #8B2000; border: 1.5px solid #f5c6c0; border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; margin-top: 16px; display: none; }
    .footer-link { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #6b5e48; }
    .footer-link a { color: #A07018; font-weight: 600; text-decoration: none; }
    .form-panel { display: none; }
    .form-panel.active { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Gig Matrix</h1>
    <div class="subtitle">Log in to your account</div>

    <div class="tabs">
      <button type="button" class="tab-btn active" id="tabTeam" onclick="switchLoginTab('team')">Team</button>
      <button type="button" class="tab-btn" id="tabPortal" onclick="switchLoginTab('portal')">Venue / Band</button>
    </div>

    <!-- Team login: Booking Agent, Administrator, Contract Agent — real Supabase Auth -->
    <form id="teamForm" class="form-panel active">
      <label>Email</label>
      <input type="email" id="teamEmail" required placeholder="you@example.com">

      <label>Password</label>
      <input type="password" id="teamPassword" required placeholder="Your password">

      <button type="submit" id="teamSubmitBtn">Log In</button>
    </form>

    <!-- Venue / Band portal login: lightweight credentials, not a real account -->
    <form id="portalForm" class="form-panel">
      <label>Username</label>
      <input type="text" id="portalUsername" required placeholder="Given to you by your booking agent">

      <label>Password</label>
      <input type="password" id="portalPassword" required placeholder="Your password">

      <button type="submit" id="portalSubmitBtn">Log In</button>
    </form>

    <div class="error" id="errorMsg"></div>

    <div class="footer-link" id="teamFooter">New here? <a href="signup.html">Create an account</a></div>
  </div>

  <script src="config.js"></script>
  <script>
    function switchLoginTab(which) {
      document.getElementById('tabTeam').classList.toggle('active', which === 'team');
      document.getElementById('tabPortal').classList.toggle('active', which === 'portal');
      document.getElementById('teamForm').classList.toggle('active', which === 'team');
      document.getElementById('portalForm').classList.toggle('active', which === 'portal');
      document.getElementById('teamFooter').style.display = which === 'team' ? 'block' : 'none';
      document.getElementById('errorMsg').style.display = 'none';
    }

    function showLoginError(msg) {
      var el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    // ── Team login (agent / admin / contract_agent) ─────────────────────────
    document.getElementById('teamForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      var email    = document.getElementById('teamEmail').value.trim();
      var password = document.getElementById('teamPassword').value;
      var btn = document.getElementById('teamSubmitBtn');
      document.getElementById('errorMsg').style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in\u2026';

      try {
        var authResult = await sb.auth.signInWithPassword({ email: email, password: password });
        if (authResult.error) throw authResult.error;

        var profileResult = await sb.from('profiles').select('id, role').maybeSingle();

        if (!profileResult.data) {
          window.location.href = 'complete-signup.html';
          return;
        }

        var role = profileResult.data.role;
        if (role === 'admin') {
          window.location.href = 'admin-dashboard.html';
        } else {
          // agent and contract_agent share the same dashboard, same as the
          // original app — contract-review panels show conditionally inside
          // it based on role.
          window.location.href = 'dashboard.html';
        }

      } catch (err) {
        showLoginError(err.message || 'Login failed. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });

    // ── Venue / Band portal login ────────────────────────────────────────────
    document.getElementById('portalForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      var username = document.getElementById('portalUsername').value.trim();
      var password = document.getElementById('portalPassword').value;
      var btn = document.getElementById('portalSubmitBtn');
      document.getElementById('errorMsg').style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in\u2026';

      try {
        var result = await sb.rpc('portal_login', { p_username: username, p_password: password });
        if (result.error) throw result.error;

        var rows = result.data || [];
        if (rows.length === 0) {
          showLoginError('Incorrect username or password.');
          btn.disabled = false;
          btn.textContent = 'Log In';
          return;
        }

        var row = rows[0];
        sessionStorage.setItem('gm_portal_token', row.session_token);
        sessionStorage.setItem('gm_portal_type', row.owner_type);
        sessionStorage.setItem('gm_portal_id', row.owner_id);
        sessionStorage.setItem('gm_portal_name', row.display_name || '');

        window.location.href = row.owner_type === 'venue' ? 'venue-portal.html' : 'band-portal.html';

      } catch (err) {
        showLoginError(err.message || 'Login failed. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
