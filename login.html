<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Gig Matrix</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0ebe0; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 36px 32px; max-width: 380px; width: 100%; }
    h1 { font-size: 1.4rem; color: #A07018; margin: 0 0 24px; }
    label { display: block; font-size: 0.8rem; font-weight: 700; color: #6b5e48; margin-bottom: 5px; margin-top: 16px; }
    input { width: 100%; padding: 11px 13px; border: 1.5px solid #d4c4a0; border-radius: 8px; font-size: 0.92rem; font-family: inherit; }
    input:focus { outline: none; border-color: #A07018; }
    button { width: 100%; margin-top: 24px; padding: 13px; background: #A07018; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    button:hover:not(:disabled) { background: #8a6014; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { background: #fdecea; color: #8B2000; border: 1.5px solid #f5c6c0; border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; margin-top: 16px; display: none; }
    .footer-link { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #6b5e48; }
    .footer-link a { color: #A07018; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Log In</h1>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required placeholder="you@example.com">

      <label>Password</label>
      <input type="password" id="password" required placeholder="Your password">

      <button type="submit" id="submitBtn">Log In</button>
    </form>

    <div class="error" id="errorMsg"></div>

    <div class="footer-link">New here? <a href="signup.html">Create an account</a></div>
  </div>

  <script src="config.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      var email    = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var btn = document.getElementById('submitBtn');
      var errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in…';

      try {
        var { error: authError } = await sb.auth.signInWithPassword({ email: email, password: password });
        if (authError) throw authError;

        // Check whether this person already has a profile (business set
        // up). If they confirmed their email after leaving the signup
        // page, this is the first moment we can actually finish that setup.
        var { data: profile } = await sb.from('profiles').select('id').maybeSingle();

        if (profile) {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'complete-signup.html';
        }

      } catch (err) {
        errEl.textContent = err.message || 'Login failed. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
